name: Build Astra Client mod
 
on:
  push:
    branches: [main, master]
  workflow_dispatch:
 
env:
  MC_VERSION: "1.21.11"   # a Fabric példa-mod ugyanilyen nevű ágát használja alapnak
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (this repo)
        uses: actions/checkout@v4
        with:
          path: astra
 
      - name: Checkout Fabric example mod (gradle setup for this MC version)
        uses: actions/checkout@v4
        with:
          repository: FabricMC/fabric-example-mod
          ref: ${{ env.MC_VERSION }}
          path: base
 
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
 
      - name: Put Astra sources into the example project
        working-directory: base
        run: |
          rm -rf src
          if grep -q splitEnvironmentSourceSets build.gradle; then
            J=src/client/java; MR=src/client/resources
          else
            J=src/main/java; MR=src/main/resources
          fi
          mkdir -p "$J" "$MR" src/main/resources
          cp -r ../astra/src/main/java/. "$J"/
          cp ../astra/src/main/resources/fabric.mod.json src/main/resources/
          cp ../astra/src/main/resources/astra.mixins.json "$MR"/
          sed -i 's/^archives_base_name=.*/archives_base_name=astra-client/; s/^mod_version=.*/mod_version=1.0.0/' gradle.properties
 
      - name: Build
        working-directory: base
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
 
      - name: Collect jar
        run: |
          mkdir out
          ls -la base/build/libs
          JAR=$(ls base/build/libs/*.jar | grep -v -e '-sources' -e '-dev' | head -n1)
          echo "Using $JAR"
          cp "$JAR" "out/astra-client-${MC_VERSION}.jar"
          ls -la out
 
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: astra-client-${{ env.MC_VERSION }}
          path: out/astra-client-${{ env.MC_VERSION }}.jar
